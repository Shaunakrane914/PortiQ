name: Python quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_DOWNLOADS: never
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned uv from PyPI
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --index-url https://pypi.org/simple uv==0.11.26
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=portiq --cov-report=term-missing --cov-report=xml
      - run: uv run portfolio-agent --help
      - run: uv run portfolio-agent init-db
      - run: uv run portfolio-agent doctor
      - run: uv run portfolio-agent exposure "Balanced Portfolio"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml

