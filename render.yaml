services:
  - type: web
    name: portiq
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORTIQ_HOST
        value: 0.0.0.0
      - key: PORTIQ_ALLOW_ANONYMOUS
        value: "1"
      - key: PORTIQ_ALLOWED_HOSTS
        value: "*"
      - key: PORTIQ_REQUEST_INTERVAL
        value: "0"
      - key: PORTIQ_RPM_LIMIT
        value: "12"
      - key: GEMINI_API_KEY
        sync: false
      - key: PORTIQ_DEMO_TOKEN
        sync: false

