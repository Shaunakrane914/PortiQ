[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "portiq"
version = "0.1.0"
description = "CLI-first Gemini portfolio analytics with deterministic financial tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0,<3",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.0,<2",
  "sqlglot>=27,<31",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[project.scripts]
portfolio-agent = "portiq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portiq"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/portiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in real Gemini calls (requires PORTIQ_LIVE=1 and API key)"]

[tool.coverage.run]
source = ["portiq"]

[tool.coverage.report]
show_missing = true
